[project]
name = "intervals-icu-mcp-server"
version = "0.1.2"
description = "MCP server for Intervals.icu endurance sports performance tracking and training analysis"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Jelmer van der Linde", email = "jelmer@vanderlinde.dev"},
]
keywords = ["intervals", "intervals.icu", "mcp", "model-context-protocol", "cycling", "running", "fitness", "training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
router = [
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/jelmervdm/intervals.icu-mcp"
Repository = "https://github.com/jelmervdm/intervals.icu-mcp"
Issues = "https://github.com/jelmervdm/intervals.icu-mcp/issues"

[project.scripts]
intervals-icu-mcp-server = "intervals_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["intervals_mcp*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning"
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = true

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
